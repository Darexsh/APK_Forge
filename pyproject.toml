[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-forge"
version = "0.1.0"
description = "Generic APK automation engine for a private Android APK catalog"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "APK Forge" }
]

[project.scripts]
apk-forge = "apk_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
